
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# macOS LIQUID GLASS — HYPRLOCK
# Arch Linux · Hyprland · Inter
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

$font = Inter ExtraBold

general {
    hide_cursor = true
    ignore_empty_input = false
    fail_timeout = 1500
}

animations {
    enabled = true
}

# ── WALLPAPER & FROSTED GLASS ─────────────────────────

background {
    monitor =
    path = screenshot
    color = rgba(18, 20, 30, 0.35)

    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.92
    brightness = 0.78
    vibrancy = 0.18
    vibrancy_darkness = 0.12
}

# ── DATE ──────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] date "+%A, %d %B"

    color = rgba(255, 255, 255, 0.78)
    font_size = 18
    font_family = $font
    text_align = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.20)

    position = 0, 255
    halign = center
    valign = center
}

# ── CLOCK · 12-HOUR AM/PM ─────────────────────────────

label {
    monitor =
    text = cmd[update:1000] date "+%I:%M %p"

    color = rgba(255, 255, 255, 0.96)
    font_size = 82
    font_family = $font
    text_align = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.25)

    position = 0, 165
    halign = center
    valign = center
}

# ── PROFILE PHOTO · RANDOM IMAGE ──────────────────────

image {
    monitor =
    path = $HOME/.config/eww/apps/Hyprlock/profile.jpg

    size = 108
    rounding = -1

    border_size = 2
    border_color = rgba(255, 255, 255, 0.72)

    position = 0, 40
    halign = center
    valign = center
}

# ── USER NAME ─────────────────────────────────────────

label {
    monitor =
    text = Welcome Back

    color = rgba(255, 255, 255, 0.94)
    font_size = 19
    font_family = $font
    text_align = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.20)

    position = 0, -65
    halign = center
    valign = center
}

# ── LIQUID GLASS PASSWORD FIELD ───────────────────────

input-field {
    monitor =

    size = 320, 54
    position = 0, -140

    halign = center
    valign = center

    rounding = 27
    outline_thickness = 1

    outer_color = rgba(255, 255, 255, 0.45)
    inner_color = rgba(255, 255, 255, 0.12)

    font_color = rgba(255, 255, 255, 0.96)
    font_family = $font

    placeholder_text = Enter Password
    fail_text = Incorrect password

    fade_on_empty = false
    hide_input = false

    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1

    check_color = rgba(190, 235, 255, 0.95)
    fail_color = rgba(255, 125, 145, 0.95)
    capslock_color = rgba(255, 210, 120, 1.0)

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.22)
}

# ── FOOTER ────────────────────────────────────────────

label {
    monitor =
    text = Touch or press Enter to unlock

    color = rgba(255, 255, 255, 0.58)
    font_size = 12
    font_family = $font
    text_align = center

    position = 0, 38
    halign = center
    valign = bottom
}
